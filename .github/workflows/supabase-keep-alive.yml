name: Keep Supabase Alive

on:
  schedule:
    # Run at 00:00 every Monday and Thursday (every 3-4 days, well within the 7-day limit)
    - cron: '0 0 * * 1,4'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          if [ -z "$POSTGRES_URL" ]; then
            echo "POSTGRES_URL secret is not set in GitHub repository secrets."
            exit 1
          fi
          
          # Install postgresql-client
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
          # URL-encode the password in the connection string to handle special characters like '#' and '/'
          # which would otherwise break the psql connection string parser.
          export ENCODED_URL=$(node -e '
            const urlStr = process.env.POSTGRES_URL;
            const match = urlStr.match(/^postgresql:\/\/([^:]+):(.+)@([^:]+):(\d+)\/(.+)$/);
            if (match) {
              const [, user, pass, host, port, db] = match;
              let decodedPass = pass;
              try { decodedPass = decodeURIComponent(pass); } catch(e) {}
              console.log(`postgresql://${user}:${encodeURIComponent(decodedPass)}@${host}:${port}/${db}`);
            } else {
              console.log(urlStr);
            }
          ')
          
          # Execute a simple query to keep the database active
          psql "$ENCODED_URL" -c "SELECT 1;"
