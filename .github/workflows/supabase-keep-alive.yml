name: Keep Supabase Alive

on:
  schedule:
    # Run at 00:00 every Monday and Thursday (every 3-4 days, well within the 7-day limit)
    - cron: '0 0 * * 1,4'
  # Allow manual triggering
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_KEY secret is not set in GitHub repository secrets."
            exit 1
          fi
          
          echo "Pinging Supabase REST API to keep the project alive..."
          
          # Make an authenticated request to the REST API root
          # This counts as activity and bypasses the IPv6 database connection issue
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" "$SUPABASE_URL/rest/v1/")
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Successfully pinged Supabase (HTTP 200)"
          else
            echo "Failed to ping Supabase, received HTTP status: $RESPONSE"
            exit 1
          fi
