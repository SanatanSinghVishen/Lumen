services:
  - type: web
    name: lumen-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - "api/**"
        - "eval/**"
        - "graph/**"
        - "tools/**"
        - "*.py"
        - "requirements.txt"
        - "render.yaml"
      ignoredPaths:
        - "frontend/**"
        - "*.md"
        - ".gitignore"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: false
